# CI — adision-api (Ad BUD, Python)
#
# Pourquoi ce fichier existe. Avant ce chantier (tests d'invariant sur les
# chiffres que Simon voit, 20 août 2026), adision-api n'avait AUCUNE CI
# GitHub — zéro ruleset, zéro branch protection, zéro workflow. Le SEUL filet
# était hooks/pre-push, un script LOCAL : il ne protège que le poste où il est
# installé (`git config core.hooksPath hooks`), jamais un push depuis un autre
# poste, un agent, ou l'éditeur web GitHub — exactement le trou qui a laissé
# passer e341af90 côté monorepo le même jour (cf. adision-monorepo/.github/
# workflows/ci.yml, section « Gabarits non corrompus »). « Un outil non armé
# ne protège rien » vaut ici aussi.
#
# Ce workflow rejoue, sur une machine que l'auteur du push ne contrôle pas, le
# SOUS-ENSEMBLE de hooks/pre-push qui ne dépend PAS du dépôt frère
# adision-monorepo — mêmes tests, mêmes gardes-fous.
#
# ─────────────────────────────────────────────────────────────────────────────
# LA LIGNE DE PARTAGE — ce qui tourne ICI et ce qui reste au pre-push local
# ─────────────────────────────────────────────────────────────────────────────
# TOURNE ICI (pur Python, aucun réseau, aucun dépôt frère) :
#   - test_pdf_critical.py              rapport/devis/émission (incl. Invariant C
#                                        — émission relais ventilation par lot,
#                                        PDF émis byte-identique à celui téléversé)
#   - test_divergences_ecran_rapport.py xfail D3/D4 (défauts documentés)
#   - test_devis_contract.py            contrat GET /devis
#   - test_devis_emit_relay.py          émission relais devis (Option B)
#   - test_verrou_production_heures.py  heures_effectives, tous les cas de
#                                        l'incident 2026-08-20 (source Python)
#   - test_invariant_a_coutant_total.py Invariant A — CONVERGENCE DES
#                                        GROUPEMENTS (lot = CSI = mat+mo+st),
#                                        chantier 20 août 2026. Il ne garde PAS
#                                        la VALEUR des heures : les trois
#                                        sommes viennent de la meme regle, donc
#                                        la changer les deplace ensemble. C'est
#                                        test_verrou_production_heures.py qui
#                                        garde la valeur, seul.
#   - verifier_source_unique.py + test_verifier_source_unique.py
#                                        couche 3 (issue #9 monorepo) : detecte
#                                        une copie locale de la regle des
#                                        heures (production_valeur) au lieu
#                                        d'une delegation a
#                                        modules.aggregates.heures_effectives.
#                                        Miroir Python du meme controle cote JS
#                                        (adision-monorepo/scripts/verifier-
#                                        source-unique.mjs). Pur Python,
#                                        aucune dependance au depot frere.
#
# NE TOURNE PAS ICI, ET CE N'EST PAS UN OUBLI (besoin du dépôt frère
# adision-monorepo + node — checkout d'un second dépôt privé = jeton
# multi-dépôt, même décision déjà actée côté monorepo pour la direction
# inverse, cf. son ci.yml) :
#   - test_devis_fidelity.py / test_report_fidelity.py / check_detention_seuil.py
#   - test_budget_fingerprint_agreement.py (accord empreinte Python↔JS)
#   - test_invariant_b_ligne_python_js.py  (Invariant B — LE PLUS IMPORTANT,
#     ligne budget Python == JS écran) — reste réservé au pre-push local,
#     où les deux dépôts sont déjà frères sur le poste de Simon.
#   - test_budget_fingerprint_production_valeur_discovery.py (verrou de
#     non-régression production_valeur, correctif appliqué le 20 août 2026 —
#     même contrainte que l'Invariant B)
#
# AUCUN SECRET DE PRODUCTION N'EST RÉFÉRENCÉ ICI — pas de base, pas de réseau
# externe (tous les tests ci-dessus monkeypatchent hub_service / get_conn).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests Python (chemins critiques + Invariant A)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Tests PDF critiques (rapport/devis/émission, incl. Invariant C)
        run: pytest tests/test_pdf_critical.py -v

      # ⚠ Lancé comme SCRIPT (python tests/…), pas via `pytest` : ses deux
      # test_d3_*/test_d4_* échouent TOUJOURS sous un runner pytest nu (leur
      # xfail est géré à la main par run_all()/__main__, pas par
      # @pytest.mark.xfail) — même invocation que hooks/pre-push. Lancer ce
      # fichier via `pytest` rendrait ce job rouge en permanence pour un
      # défaut DÉJÀ documenté, exactement l'anti-motif que ce chantier corrige
      # ailleurs (cf. l'avertissement `npm run contraste` du ci.yml monorepo).
      - name: Divergences écran↔rapport connues (D3/D4, xfail)
        run: python tests/test_divergences_ecran_rapport.py

      - name: Contrat GET /devis
        run: pytest tests/test_devis_contract.py -v

      - name: Émission relais devis (Option B)
        run: pytest tests/test_devis_emit_relay.py -v

      - name: Verrou production_valeur (heures_effectives, incident 2026-08-20)
        run: pytest tests/test_verrou_production_heures.py -v

      - name: Invariant A — convergence des groupements (lot = CSI = mat+mo+st)
        run: pytest tests/test_invariant_a_coutant_total.py -v

      # 10 sept 2026 — LE CHEMIN DU RAPPORT. Mesure : en faisant compter au
      # rapport les lignes que Simon a DESACTIVEES
      # (`raw_lignes_actives = list(lignes_calc)` dans ad_budget_api),
      # test_invariant_a ET test_pdf_critical restaient VERTS. Le chemin des
      # LOTS etait garde, celui du RAPPORT ne l'etait pas — et c'est le
      # rapport que Simon regarde. Ce fichier ferme le trou et a ete eprouve
      # a l'envers contre cette mutation exacte.
      - name: Le rapport exclut-il les lignes desactivees ?
        run: pytest tests/test_rapport_ligne_inactive.py -v

      # PARITE des versions debalancees : le serveur et l'ecran doivent rendre
      # les MEMES nombres. La fixture avait ete convenue avec PC4 le 5 octobre
      # et n'etait lue par AUCUN test — pas par oubli : `_derive` vivait a
      # l'interieur de `register_ad_budget_routes` et n'etait importable par
      # personne. Mesure du defaut qu'elle a revele : sur le cas des lignes
      # « % » et au mille, le serveur rendait +620,00 $ la ou l'ecran attend 0.
      # La fixture est copiee dans tests/fixtures/ pour etre lue ICI AUSSI :
      # le precedent (test_invariant_b) se SAUTE quand le depot frere est
      # absent, donc en CI, c'est-a-dire la ou ca compte.
      - name: Versions debalancees — parite avec l'ecran (fixture partagee)
        run: python tests/test_parite_versions_debalancees.py

      # Journal des parametres financiers (7 oct. 2026, apres l'enquete 7,887 %
      # du projet 290) : quels champs, quand c'est un changement. Pur, sans base.
      - name: Journal des parametres financiers
        run: python tests/test_journal_parametres_financiers.py

      # Couche 3 (issue #9 monorepo) : une copie locale de la regle des
      # heures (production_valeur prioritaire) au lieu d'une delegation a
      # modules.aggregates.heures_effectives.
      - name: Source unique - pas de copie locale de la regle des heures
        run: python tools/verifier_source_unique.py

      # 1er oct 2026 : 27 fichiers de tests sur 49 n'etaient cites NULLE PART
      # ici -- ils ne tournaient jamais, et l'on se croyait couvert (dont la
      # garde des copies, muette depuis le 11 sept). Tout tests/test_*.py et
      # tests/check_*.py est cite ici, ou nomme dans EXCLUSIONS avec sa raison.
      - name: Garde-fou - aucun test hors CI sans exclusion nommee
        run: python tools/verifier_tests_cables.py

      # Le garde-fou ci-dessus, vu en train de mordre (faux depots).
      - name: Garde-fou - son propre temoin
        run: python tests/test_verifier_tests_cables.py

      # 18 bancs VERTS qui ne tournaient nulle part (1er oct 2026, mesure PC3 :
      # 116 tests). Retires d'EXCLUSIONS du garde-fou dans le MEME commit.
      - name: Bancs rebranches le 1er oct (18 fichiers, pytest)
        run: |
          python -m pytest -q \
            tests/test_aggregates.py \
            tests/test_auth_jwt.py \
            tests/test_bud_presence.py \
            tests/test_budget_fingerprint_champs_neutres.py \
            tests/test_contacts_rapport.py \
            tests/test_versions_debalancees.py \
            tests/test_convert_hors_lot_endpoint.py \
            tests/test_decode_token_graceful.py \
            tests/test_devis_documents_filter.py \
            tests/test_duplicate_lot_endpoint.py \
            tests/test_gabarit_add_ligne.py \
            tests/test_item_routes_supprimees.py \
            tests/test_ligne_commentaires.py \
            tests/test_lots_calc.py \
            tests/test_pdf_lots_recap.py \
            tests/test_quantite_effective.py \
            tests/test_quantites_liees.py \
            tests/test_regroupements_lignes.py \
            tests/test_reorder_budget_lignes.py \
            tests/test_scope_deux_onglets.py \
            tests/test_seed_master_sans_prix.py \
            tests/test_taux_horaires_api.py

      # CLOISONNEMENT DE LA CORBEILLE (2 oct 2026). Les 3 routes /admin/* de
      # la corbeille d'Ad BUD ne portaient AUCUN filtre d'organisation : un
      # gestionnaire de n'importe quelle entreprise cliente voyait, restaurait
      # et SUPPRIMAIT DEFINITIVEMENT (DELETE physique + CASCADE) les projets
      # supprimes de toutes les autres. L'asymetrie etait la preuve : METTRE a
      # la corbeille passait par _load_and_authorize_projet, en SORTIR ne
      # passait par rien.
      #
      # Le banc verrouille la propriete pour les 30 routes du module qui
      # touchent ad_budget.projets, pas seulement les 3 reparees -- sinon une
      # QUATRIEME naitrait a cote sans que rien ne la voie. Eprouve A L'ENVERS
      # avant d'etre cable : rejoue contre le code d'avant le correctif, 7 cas
      # rougissent et les 5 temoins anti-vacuite restent verts.
      - name: Corbeille Ad BUD - cloisonnement par organisation
        run: pytest tests/test_corbeille_cloisonnement_org.py -v

      # Filet de tools/verifier_source_unique.py (etape « Source unique - pas
      # de copie locale de la regle des heures ») : injecte une copie dans un vrai fichier
      # temporaire et verifie qu'il la detecte pour de vrai.
      - name: Source unique - le controle mord-il pour de vrai (filet)
        run: pytest tests/test_verifier_source_unique.py -v

      # 3 sept 2026 — duplication de projet : les LOTS n'étaient jamais
      # copiés (lot_id exclu sans jamais dupliquer les lots eux-mêmes, cf.
      # _dupliquer_lots_et_lignes). Pur Python, fausse DB en mémoire,
      # aucune dépendance réseau.
      - name: Duplication de budget - les lots sont copiés et réassignés
        run: pytest tests/test_dupliquer_lots_et_lignes.py -v

      - name: Dupliquer - garde d idempotence (meme utilisateur)
        run: python tests/test_dupliquer_idempotence.py

      - name: Dupliquer - copies entre collegues, cloisonnement, rang
        run: python tests/test_copies_entre_collegues.py

      # 11 sept 2026 - cinq budgets vivants (318, 192, 193, 273, 295) etaient
      # invisibles parce que le hub ne rendait qu'un booleen confondant
      # "revision perimee" et "projet supprime". Verrouille : la cause remonte,
      # le hub muet n'invente rien, et la liste ne cascade AUCUNE suppression.
      - name: Projet hub supprime - visible avec mention, jamais masque
        run: pytest tests/test_hub_supprime_visible.py -v

      # 15 sept 2026 - Simon, 2e demande explicite : a l'ouverture d'un
      # projet EXISTANT, toute ligne sans taux horaire (0/NULL) doit prendre
      # le taux CHARPENTIER_C par defaut. Le D5 du 9 sept ne couvrait que la
      # creation de ligne et le PATCH explicite du champ taux_horaire ; GET
      # /projets/{id}/lignes (le seul chemin appele a l'ouverture) ne
      # corrigeait rien. Verrouille : script (memes contraintes que
      # test_divergences_ecran_rapport.py - fake cursor pilote par une file
      # de reponses, pas un vrai pytest).
      - name: Backfill taux horaire par defaut - ouverture de projet
        run: python tests/test_taux_horaire_backfill_ouverture.py

      - name: Imports en lot - taux horaire jamais a 0 (regle #35)
        run: python tests/test_import_taux_jamais_zero.py

      - name: Pastilles Ad BUD = classement unique du hub
        run: python tests/test_pastilles_classement_hub.py

      - name: Photo Ad ANA figee au classement
        run: python tests/test_figer_photo_au_classement.py

      - name: Porte /internal/hub-cache/etat - Ad BUD declare son etat au hub
        run: python tests/test_hub_cache_etat.py

      - name: Le statut d Ad BUD remonte au hub (chemin montant, refus franc)
        run: python tests/test_statut_remonte_au_hub.py

      - name: Ligne Ad TYP - code CSI, jamais Uniformat
        run: python tests/test_section_csi_typ.py

      - name: Ligne Ad TYP - taux par defaut, jamais de pseudo-taux
        run: python tests/test_typ_taux_defaut.py

      # 16 sept 2026 - « + Ligne » enregistrait la ligne a ordre 0 : au
      # rechargement elle remontait en tete de section.
      - name: Creation de ligne - rang persiste (+ Ligne)
        run: pytest tests/test_create_ligne_a_completer.py -v

      # 16 sept 2026 - clic droit « Copier dans le lot ».
      - name: Copier des lignes dans un lot
        run: pytest tests/test_copier_lignes_vers_lot.py -v

      # 16 sept 2026 - troisieme porte muree par le renommage des statuts du
      # 9 sept : creation sans statut refusee par projets_statut_chk, et les
      # quatre gardes catalogue (refresh-typ, maj-typ, maj-typ/apply,
      # maj-mat/apply) fermees pour TOUS les projets (`== "brouillon"`).
      # Execute les vraies routes pour chacun des cinq statuts, et interdit
      # toute comparaison de statut hors ALLOWED_STATUTS (Python et SQL).
      - name: Statuts - aucune comparaison a une valeur disparue
        run: python tests/test_statuts_litteraux_morts.py
